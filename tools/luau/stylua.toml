# StyLua settings for the Wurst sources.
# Read by tools/luau/format.mjs (the wasm entry point takes an object, not a file)
# and by StyLua itself if the native binary is on PATH.
syntax = "Luau"
tabs_width = 4
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
