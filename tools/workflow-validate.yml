# The workflow this repository runs, staged here because a GitHub App cannot
# push to `.github/workflows/`.
#
# It is live now: everything below this header is byte for byte what
# `.github/workflows/validate.yml` contains, and the gate fails if the two
# ever drift apart. That is the whole reason this copy still exists — an agent
# that needs to change CI edits this file and asks for it to be copied across,
# instead of describing the change in a pull request nobody can apply.
#
# It replaces every hand-written step with one call to `tools/validate.sh`, so
# a green tick here and a green run on your machine mean the same thing. The
# hand-written version it replaced walked every .lua file in the repository
# for its header check, including `reference/vape-v4-universal.lua` — third
# party source that starts with its own watermark line, and that
# `tools/validate.sh` excludes precisely because it is not ours to reformat.

name: Validate repository

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the Luau toolchain
        shell: bash
        run: |
          curl -fsSL -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.732/luau-ubuntu.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile /tmp/luau/luau-analyze

      - name: Run repository checks
        shell: bash
        env:
          # A missing toolchain is a failed job here, not a skipped check.
          REQUIRE_LUAU: "1"
          LUAU_DIR: /tmp/luau
        run: bash tools/validate.sh
