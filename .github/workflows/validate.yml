name: Validate repository

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        shell: bash
        run: |
          python -m json.tool src/gui/Current/Images/manifest.json >/dev/null
          python -m json.tool src/gui/Current/Assets/manifest.json >/dev/null

      - name: Verify source layout
        shell: bash
        run: |
          test -f src/games/Universal.luau
          test -f src/games/MM2.luau
          test -f src/games/TRS.luau
          test -f src/games/VD.luau
          test -f src/Profile/142823291.lua
          test -f src/Profile/14315258385.lua
          test -f src/Profile/93978595733734.lua
          test -f src/gui/Current/gui.lua
          test -d src/gui/Current/Images
          test -f src/gui/Current/Images/menu-toggle.png
          test -f src/gui/Current/Images/aurora-background.jpg
          test -f src/gui/Current/Images/aurora-background.png
          test -f src/gui/Current/Images/menu-toggle.editable.png
          test -f src/gui/Current/Assets/header-anime.png
          test -f src/gui/Current/Assets/Blossoms/blossom-spritesheet.png
          test -f src/gui/Current/Assets/Header/anime-header.jpg
          test -f src/gui/Current/Assets/Animations/blossoms-spritesheet.png
          test -f src/gui/Current/Assets/Typography/title-logo.png
          test -f src/gui/Current/Assets/Particles/snow-dot.png
          test -f src/gui/Current/Assets/Particles/emo-star.png
          test -f src/gui/Current/Assets/Particles/ash-fragment.png
          test -f src/gui/Current/Assets/Particles/black-petal.png
          test -f src/gui/Current/Assets/Decorations/spike-corner-left.png
          test -f src/gui/Current/Assets/Decorations/spike-corner-right.png
          test -f src/gui/Current/Assets/Decorations/chain-divider.png
          test -f src/gui/Current/Assets/Decorations/ink-scratch.png
          test -f src/gui/Current/Assets/Decorations/cross-small.png
          test -f src/gui/Current/Assets/Decorations/halftone-fade.png
          test -f src/gui/Current/Assets/Source/darkcore-asset-sheet.png
          test -f src/gui/Current/Assets/Source/cosmic-controls-sheet.png
          test -f src/gui/Current/Assets/Icons/search.png
          test -f tools/process_manga_assets.py
          test -f tools/generate_darkcore_assets.py
          test -f src/library/AssetRegistry.luau
          test -f src/library/ProfileRegistry.luau

      - name: Verify game module contracts
        shell: bash
        run: |
          for file in src/games/Universal.luau src/games/MM2.luau src/games/TRS.luau src/games/VD.luau; do
            grep -q 'return Module' "$file"
            grep -q 'function Module.init' "$file"
            grep -q 'function Module.destroy' "$file"
          done

      - name: Verify strict Luau headers
        shell: bash
        run: |
          while IFS= read -r file; do
            test "$(head -n 1 "$file")" = "--!strict"
          done < <(find . -type f \( -name "*.lua" -o -name "*.luau" \) -print)

      - name: Compile Luau sources
        shell: bash
        run: |
          curl -fsSL -o /tmp/luau.zip \
            https://github.com/luau-lang/luau/releases/download/0.732/luau-ubuntu.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          while IFS= read -r file; do
            /tmp/luau/luau-compile "$file" >/dev/null
          done < <(find . -type f \( -name "*.lua" -o -name "*.luau" \) \
            ! -name "*.d.luau" -print)
          /tmp/luau/luau-compile loadstring >/dev/null
