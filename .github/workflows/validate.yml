name: Validate repository

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests
        shell: bash
        run: |
          python -m json.tool src/assets/manifest.json >/dev/null
          python -m json.tool src/Profile/index.json >/dev/null
          python -m json.tool src/Profile/mm2.json >/dev/null
          python -m json.tool src/Profile/trs.json >/dev/null

      - name: Verify source layout
        shell: bash
        run: |
          test -f src/Supported/MM2.luau
          test -f src/Supported/TRS.luau
          test -f src/gui/Current/ARandomMenu.luau
          test -f src/library/AssetRegistry.luau
          test -f src/library/ProfileRegistry.luau

      - name: Verify strict Luau headers
        shell: bash
        run: |
          while IFS= read -r file; do
            test "$(head -n 1 "$file")" = "--!strict"
          done < <(find . -type f -name "*.luau" -print)
